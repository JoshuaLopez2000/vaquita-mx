services:
  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgres://vaquita:vaquita-local@postgres:5432/vaquita?sslmode=disable
      PAYMENT_PROVIDER: simulated
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./services/api
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://vaquita:vaquita-local@postgres:5432/vaquita?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaquita
      POSTGRES_USER: vaquita
      POSTGRES_PASSWORD: vaquita-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaquita -d vaquita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
