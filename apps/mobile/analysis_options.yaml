include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.47+ deprecates package:flutter/material.dart and generated
    # GlobalMaterialLocalizations in favor of package:material_ui, which is not
    # available on older stable SDKs (e.g. 3.44.x). Remove once min SDK >= 3.47.
    deprecated_member_use: ignore

linter:
  rules:
    prefer_final_locals: true
    use_super_parameters: true
