name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile
        - API
        - Payments
        - Infrastructure
        - Unknown
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the exact user-visible or system-visible result?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, request IDs, device information, or affected versions. Never include secrets or financial credentials.

  - type: textarea
    id: impact
    attributes:
      label: Impact and frequency
      description: Who is affected, how seriously, and how often?
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: Describe the automated test that should prevent recurrence.
